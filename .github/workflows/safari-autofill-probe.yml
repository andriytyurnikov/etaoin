# Throwaway diagnostic, fork-only. Reports what the macos-latest image carries for
# Safari AutoFill, then runs the autofill namespace to see whether the quirk fires
# there. Never merge this; delete the branch once the question is answered.

name: Safari AutoFill probe

on:
  workflow_dispatch:
  push:
    branches: ['probe/**']

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7

    - name: Image identity
      run: |
        sw_vers
        uname -m
        defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString

    # The runner image only runs `safaridriver --enable` and sets AllowRemoteAutomation;
    # nothing in actions/runner-images mentions AutoFill. Confirm that from the inside.
    #
    # Read the container plist directly. `defaults read com.apple.Safari` reports the
    # domain as missing even where the file exists -- TCC blocks the read and the error
    # is indistinguishable from absence, so it is a false negative, not a measurement.
    - name: Safari AutoFill preferences
      run: |
        plist="$HOME/Library/Containers/com.apple.Safari/Data/Library/Preferences/com.apple.Safari.plist"
        echo "path: $plist"
        ls -la "$plist" 2>&1 || echo "(plist absent)"
        for k in AutoFillPasswords AutoFillCreditCardData \
                 AutoFillFromAddressBook AutoFillMiscellaneousForms; do
          printf '%-28s ' "$k"
          plutil -extract "$k" raw "$plist" 2>&1 | head -1
        done
        echo "--- whole plist ---"
        plutil -p "$plist" 2>&1 | head -80
        echo "--- same keys via defaults, for contrast ---"
        defaults read com.apple.Safari AutoFillPasswords 2>&1 | head -3

    # The live hypothesis: AutoFill is enabled but has nothing to offer, so Safari
    # never classifies the form as a login form and never moves focus.
    - name: Credential store state
      run: |
        echo "--- keychains ---"
        security list-keychains
        ls -la ~/Library/Keychains 2>&1 || true
        echo "--- any internet passwords? (metadata only, no -g) ---"
        security find-internet-password 2>&1 | head -20 || echo "none found"
        echo "--- any generic passwords? ---"
        security find-generic-password 2>&1 | head -20 || echo "none found"
        echo "--- Apple ID / iCloud accounts ---"
        defaults read MobileMeAccounts 2>&1 || true

    - name: WebDriver config
      run: /usr/libexec/PlistBuddy -c print ~/Library/WebDriver/com.apple.Safari.plist 2>&1 || true

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'

    - uses: DeLaGuardo/setup-clojure@13.6.1
      with:
        bb: latest

    # The image already does this at build time, but assert it explicitly here: if
    # WebDriver support were somehow off, every conclusion about AutoFill would be
    # drawn from a Safari that never entered the state the tests assume.
    - name: Enable safaridriver
      run: |
        sudo safaridriver --enable
        echo "exit=$?"
        /usr/libexec/PlistBuddy -c print ~/Library/WebDriver/com.apple.Safari.plist 2>&1 || true

    # safaridriver does not honour acceptInsecureCerts, so an https fixture needs a cert
    # the system genuinely trusts rather than one Safari is talked into accepting.
    - name: Generate and trust a localhost certificate
      run: |
        mkdir -p /tmp/probe-tls
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout /tmp/probe-tls/key.pem -out /tmp/probe-tls/cert.pem \
          -subj "/CN=localhost" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
        cat /tmp/probe-tls/key.pem /tmp/probe-tls/cert.pem > /tmp/probe-tls/combined.pem
        sudo security add-trusted-cert -d -r trustRoot \
          -k /Library/Keychains/System.keychain /tmp/probe-tls/cert.pem
        echo "--- verify ---"
        security verify-cert -c /tmp/probe-tls/cert.pem 2>&1 || true

    # Both schemes served from the same fixtures on the same machine, so the only
    # difference between the two probe runs below is the scheme.
    - name: Serve fixtures over http and https
      run: |
        root=env/test/resources/static
        python3 -m http.server 8080 --bind localhost --directory "$root" \
          >/tmp/http.log 2>&1 &
        python3 probe/https_server.py 8443 /tmp/probe-tls/combined.pem "$root" \
          >/tmp/https.log 2>&1 &
        for i in $(seq 1 30); do
          curl -sf http://localhost:8080/autofill-off.html >/dev/null && break || sleep 1
        done
        for i in $(seq 1 30); do
          curl -sf --cacert /tmp/probe-tls/cert.pem \
            https://localhost:8443/autofill-off.html >/dev/null && break || sleep 1
        done
        echo "http  -> $(curl -so /dev/null -w '%{http_code}' \
          http://localhost:8080/autofill-off.html)"
        echo "https -> $(curl -so /dev/null -w '%{http_code}' --cacert /tmp/probe-tls/cert.pem \
          https://localhost:8443/autofill-off.html)"
        cat /tmp/https.log

    # http first, as the control: it should match the failing CI result exactly.
    - name: Probe http (control)
      run: bb -Sdeps '{:deps {etaoin/etaoin {:local/root "."}}}' probe/autofill_scheme.clj http://localhost:8080

    - name: Probe https
      run: bb -Sdeps '{:deps {etaoin/etaoin {:local/root "."}}}' probe/autofill_scheme.clj https://localhost:8443
